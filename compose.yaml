services:
  bgutil-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2
    expose:
      - "4416"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:4416/ping').then(response => {
          if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  postgres:
    image: postgres:18.1-alpine
    environment:
      POSTGRES_DB: fishie
      POSTGRES_USER: fishie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fishie -d fishie"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    command: ["python", "manage.py", "migrate"]
    environment: &fishie-env
      DATABASE_URL: postgresql://fishie:${POSTGRES_PASSWORD}@postgres/fishie
      FISHIE_CONFIG: /run/secrets/config.toml
      FISHIE_CREDENTIAL_KEY: ${FISHIE_CREDENTIAL_KEY:?set FISHIE_CREDENTIAL_KEY}
    volumes:
      - ./config.toml:/run/secrets/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  fishie:
    build: .
    environment:
      <<: *fishie-env
      FISHIE_API_HOST: 0.0.0.0
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      FISHIE_USER_BADGES_PATH: /app/data/user_badges.json
      FISHIE_BURGERS_ROOT: /app/data/burgers
      FISHIE_BURGERS_CATALOG_PATH: /app/data/burgers_catalog.json
      FISHIE_YOUTUBE_POT_PROVIDER_URL: http://bgutil-pot-provider:4416
    volumes:
      - ./config.toml:/run/secrets/config.toml:ro
      - ./src/files/cookies:/app/src/files/cookies:ro
      - ./src/files/data:/app/data
      - downloads:/app/src/files/downloads
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      bgutil-pot-provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  downloads:
